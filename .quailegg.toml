# Generated by qegg. Keep this file in version control.
schema_version = 1

[project]
default_branch = "main"

[git]
tag_prefix = "v"
remote = "origin"

[release]
mode = "pr"
github_release = true
commit_message = "chore(release): v{{version}}"

[changes]
dir = ".changes"
scope = ["cmd"]

[verify]
commands = ["go test ./..."]
timeout = "15m"
fail_fast = true

[publish]
registries = ["go"]

[packages."github.com/Wsrsq/qegg-pr-mode-ci"]
path = "."
resolver = "go"
publish = true
